# EMPATH Unit Scheduler — Fly.io app config.
# `app` must be globally unique on Fly; `fly launch` will prompt you to pick one if this name is taken.
app = "empath-scheduler"
primary_region = "ord"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"

[[mounts]]
  source = "empath_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
