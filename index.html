<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMPATH Unit Scheduler — Demo</title>
<style>
  :root{
    --bg:#FDFCFE; --panel:#FFFFFF; --ink:#2A2438; --ink-soft:#6B6178;
    --border:#E6DFF2; --border-soft:#F3EFFA;
    --purple:#8C6FC9; --purple-soft:#EFE8FA;
    --gold:#B8892B; --gold-soft:#FAF1DC;
    --rust:#B5502E; --rust-soft:#F7E7E1;
    --green:#3C7A4E; --green-soft:#E4F0E7;
    --amber:#B8892B; --amber-soft:#FAF1DC;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg:#1B1723; --panel:#241F2E; --ink:#EDE9F5; --ink-soft:#A79BB8;
      --border:#3A3248; --border-soft:#2D2638;
      --purple-soft:#382C50; --gold-soft:#3A2E14; --rust-soft:#3A2119; --green-soft:#1D3324; --amber-soft:#3A2E14;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1723; --panel:#241F2E; --ink:#EDE9F5; --ink-soft:#A79BB8;
    --border:#3A3248; --border-soft:#2D2638;
    --purple-soft:#382C50; --gold-soft:#3A2E14; --rust-soft:#3A2119; --green-soft:#1D3324; --amber-soft:#3A2E14;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  header{ padding:16px 24px; border-bottom:1px solid var(--border); display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; }
  header h1{ font-size:19px; margin:0; letter-spacing:-0.01em; }
  header .sub{ color:var(--ink-soft); font-size:12.5px; margin-top:3px; }
  .stats{ display:flex; gap:18px; flex-wrap:wrap; }
  .stat{ text-align:right; }
  .stat .n{ font-family:var(--mono); font-size:18px; font-weight:600; }
  .stat .l{ color:var(--ink-soft); font-size:11px; }
  .stat.warn .n{ color:var(--rust); }
  .stat.ok .n{ color:var(--green); }

  nav{ display:flex; gap:2px; padding:0 24px; border-bottom:1px solid var(--border); overflow-x:auto; }
  nav button{ background:none; border:none; padding:12px 14px; font:inherit; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; }
  nav button.active{ color:var(--ink); border-bottom-color:var(--purple); font-weight:600; }

  main{ padding:20px 24px 60px; max-width:1180px; margin:0 auto; }
  .panel{ background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:18px; margin-bottom:18px; }
  .panel h2{ font-size:14px; margin:0 0 4px; }
  .panel .desc{ color:var(--ink-soft); font-size:12.5px; margin:0 0 14px; max-width:72ch; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  label{ font-size:12px; color:var(--ink-soft); display:block; margin-bottom:3px; }
  select, input[type=number], input[type=text], input[type=date], input[type=time]{
    font:inherit; font-family:var(--sans); padding:6px 8px; border:1px solid var(--border);
    border-radius:4px; background:var(--panel); color:var(--ink); min-width:0;
  }
  button.btn{ font:inherit; padding:7px 13px; border-radius:4px; border:1px solid var(--purple); background:var(--purple); color:#fff; cursor:pointer; font-weight:600; font-size:12.5px; }
  button.btn.secondary{ background:transparent; color:var(--purple); }
  button.btn.danger{ background:var(--rust); border-color:var(--rust); color:#fff; }
  button.btn:hover{ filter:brightness(1.06); }
  button.icon-btn{ background:none; border:none; cursor:pointer; color:var(--ink-soft); font-size:13px; padding:2px 5px; }
  button.icon-btn:hover{ color:var(--rust); }

  .cov-day{ display:grid; grid-template-columns:74px 1fr; gap:10px; align-items:center; padding:5px 0; }
  .cov-day .lbl{ font-size:12px; color:var(--ink-soft); }
  .cov-ticks{ display:grid; grid-template-columns:repeat(24,1fr); gap:1.5px; }
  .tick{ height:22px; border-radius:2px; background:var(--border-soft); position:relative; cursor:pointer; }
  .tick.ok{ background:var(--green); opacity:.55; }
  .tick.short{ background:var(--rust); }
  .tick.floor-fail{ background:var(--rust); box-shadow:0 0 0 1.5px var(--rust) inset; }
  .tick:hover{ outline:2px solid var(--ink); outline-offset:1px; }
  .tick.selected{ box-shadow:0 0 0 2px var(--purple) inset, 0 0 0 1px var(--purple); }
  .tick.shift-edge{ border-left:2px solid var(--ink); }
  .tick:hover::after{
    content: attr(data-tip); position:absolute; bottom:26px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--bg); font-size:11px; padding:4px 7px; border-radius:4px;
    white-space:nowrap; z-index:5; font-family:var(--sans); pointer-events:none;
  }
  .hour-axis{ display:grid; grid-template-columns:74px 1fr; gap:10px; margin-top:2px; }
  .hour-axis .ha{ display:grid; grid-template-columns:repeat(24,1fr); font-size:9px; color:var(--ink-soft); font-family:var(--mono); }
  .legend{ display:flex; gap:14px; margin-top:12px; font-size:11.5px; color:var(--ink-soft); flex-wrap:wrap; }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .swatch{ width:10px; height:10px; border-radius:2px; display:inline-block; }
  @media (max-width: 640px){
    select, input[type=number], input[type=text], input[type=date], input[type=time]{ font-size:16px; }
    .cov-ticks{ gap:1px; }
    .tick{ height:26px; }
    main{ padding:14px 10px 60px; }
    .panel{ padding:12px; }
    .cal-grid{ gap:2px; }
    .cal-cell{ min-height:40px; padding:3px 2px; font-size:9.5px; overflow:hidden; }
    .cal-daynum{ font-size:10px; }
    .cal-detail{ display:none; }
    .cal-dots{ display:flex; }
  }
  @media print {
    header, nav, .no-print { display:none !important; }
    body{ background:#fff; color:#000; }
    main{ padding:0; max-width:none; }
    #printArea{ border:none !important; box-shadow:none !important; background:#fff !important; padding:0 !important; margin:0 !important; }
    .print-scroll{ overflow:visible !important; }
  }
  .print-scroll{ overflow-x:auto; }

  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  th{ text-align:left; color:var(--ink-soft); font-weight:600; font-size:11px; padding:6px 8px; border-bottom:1px solid var(--border); }
  td{ padding:6px 8px; border-bottom:1px solid var(--border-soft); vertical-align:top; }
  tr:hover td{ background:var(--border-soft); }
  .pill{ display:inline-block; padding:2px 7px; border-radius:20px; font-size:11px; font-weight:600; }
  .pill.mgr{ background:var(--gold-soft); color:var(--gold); }
  .pill.rn{ background:var(--purple-soft); color:var(--purple); }
  .pill.aide{ background:var(--gold-soft); color:var(--gold); }
  .pill.pt{ background:var(--amber-soft); color:var(--amber); }
  .pill.cert{ background:var(--green-soft); color:var(--green); }
  .pill.nocert{ background:var(--border-soft); color:var(--ink-soft); }
  .pill.pending{ background:var(--amber-soft); color:var(--amber); }
  .pill.approved{ background:var(--green-soft); color:var(--green); }
  .pill.denied{ background:var(--rust-soft); color:var(--rust); }

  .chip{ display:inline-flex; align-items:center; gap:6px; background:var(--purple-soft); color:var(--purple); border-radius:4px; padding:3px 7px; font-family:var(--mono); font-size:11.5px; margin:2px 3px 2px 0; }
  .chip.night{ background:var(--gold-soft); color:var(--gold); }
  .chip button{ background:none;border:none;cursor:pointer;color:inherit;font-size:12px;padding:0;line-height:1; }

  .daycell{ min-width:118px; }
  .add-shift{ font-size:11px; color:var(--ink-soft); background:none; border:1px dashed var(--border); border-radius:4px; padding:3px 6px; cursor:pointer; margin-top:2px; }
  .add-shift:hover{ color:var(--purple); border-color:var(--purple); }

  .inline-form{ display:flex; gap:6px; flex-wrap:wrap; align-items:end; margin-top:8px; padding:10px; background:var(--border-soft); border-radius:5px; }
  .flag{ font-size:11px; padding:5px 8px; border-radius:4px; margin-right:4px; }
  .flag.warn{ background:var(--amber-soft); color:var(--amber); }
  .flag.bad{ background:var(--rust-soft); color:var(--rust); }
  .flag.ok{ background:var(--green-soft); color:var(--green); }
  .flag.block{ display:block; margin-bottom:10px; }

  .empty{ color:var(--ink-soft); font-size:12.5px; padding:14px; text-align:center; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-head{ font-size:11px; color:var(--ink-soft); text-align:center; padding:2px; font-weight:600; }
  .cal-cell{ border:1px solid var(--border); border-radius:4px; min-height:58px; padding:4px; font-size:10.5px; }
  .cal-cell.empty-cell{ border:none; }
  .cal-cell.selectable{ cursor:pointer; }
  .cal-cell.selectable:hover{ border-color:var(--purple); }
  .cal-cell.past{ background:var(--border-soft); }
  .cal-cell.today{ outline:2px solid var(--purple); outline-offset:-2px; }
  .cal-cell.sel{ background:var(--purple-soft); box-shadow:0 0 0 2px var(--purple) inset; }
  .cal-shift.done{ background:var(--border); color:var(--ink-soft); }
  .cal-tag{ display:inline-block; border-radius:3px; padding:0 3px; margin:2px 2px 0 0; font-size:9px; font-weight:700; font-family:var(--mono); }
  .cal-tag.pending{ background:var(--amber-soft); color:var(--amber); }
  .cal-tag.approved{ background:var(--green-soft); color:var(--green); }
  .cal-tag.denied{ background:var(--rust-soft); color:var(--rust); }
  .cal-tag.due{ background:var(--gold-soft); color:var(--gold); outline:1px dashed var(--gold); }
  .badge{ display:inline-block; min-width:16px; padding:0 5px; margin-left:6px; border-radius:9px; background:var(--rust); color:#fff; font-size:10.5px; line-height:16px; text-align:center; }
  .cal-daynum{ color:var(--ink-soft); font-family:var(--mono); font-size:10px; }
  .cal-shift{ background:var(--purple-soft); color:var(--purple); border-radius:3px; padding:1px 3px; margin-top:2px; font-family:var(--mono); font-size:9.5px; }
  .cal-dots{ display:none; gap:3px; margin-top:4px; justify-content:center; flex-wrap:wrap; }
  .dot{ width:6px; height:6px; border-radius:50%; display:inline-block; }
  .dot-shift{ background:var(--purple); }
  .dot-pending{ background:var(--amber); }
  .dot-approved{ background:var(--green); }
  .dot-denied{ background:var(--rust); }
  .dot-due{ background:var(--gold); box-shadow:0 0 0 1px var(--gold); }
  .rank-list{ padding-left:18px; }
  .rank-list li{ margin-bottom:6px; }
  .foot-note{ font-size:11px; color:var(--ink-soft); margin-top:16px; border-top:1px solid var(--border); padding-top:12px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>EMPATH Unit Scheduler</h1>
    <div class="sub">12-capacity crisis stabilization unit, ED extension. Saves automatically.</div>
    <div id="modeToggle" style="margin-top:8px"></div>
  </div>
  <div id="undoControl"></div>
  <div id="syncStatus"></div>
  <div class="stats" id="statsBar"></div>
</header>

<nav id="tabs"></nav>
<main id="main"></main>

<script>
/* ============ STATE ============ */
const WEEK_START = "2026-09-14"; // default starting week
function weekDays(start){ return Array.from({length:7}, (_,i)=>addDays(start,i)); }
let DAYS = weekDays(WEEK_START);
const DAY_NAMES = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

function isoLocal(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function addDays(iso,n){ const d = new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); return isoLocal(d); }
function todayISO(){ return isoLocal(new Date()); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtHour(h){ h=((h%24)+24)%24; const ampm = h<12?"a":"p"; let hr=h%12; if(hr===0) hr=12; return hr+ampm; }
function reqLabel(r){
  if(r.type==="Desired shift" && r.start!=null) return `Desired shift ${fmtHour(r.start)}–${fmtHour((r.start+r.duration)%24)}`;
  return r.type;
}
function statusClass(s){ return s==="rejected" ? "denied" : s; }

let state = {
  mode:"manager",
  employeeId:null,
  employeeView:"month",
  employeeMonth:null,        // 'YYYY-MM' shown in the employee calendar; null = month of the week open in Coverage
  empSel:{start:null,end:null,picking:false},
  empReqType:"PTO",
  censusSubmissions:[],      // {id,nurseId,date,day,night,note,status:'pending'|'approved'|'rejected'}
  censusPrompt:"Patients on the unit during your shift (use the same measure every time, e.g. the count at handoff)",
  weekStart: WEEK_START,
  otThreshold: 40,
  holidays: ["2026-11-26","2026-11-27","2026-12-25","2027-01-01"],
  requirement: { day:2, night:1, floor:1, aideFloor:1 },
  ratioTarget: 5,
  censusViewMode: "week",
  budget: { rnWage:48, mgrWage:58, diffPct:10, holidayDiffPct:50, weeklyTarget:14000 },
  printOpts: { format:"grid", orientation:"portrait", includeRole:true, includeOT:true, includeHoliday:true, note:"" },
  census: {
    [DAYS[0]]:{day:0,night:0}, [DAYS[1]]:{day:0,night:0}, [DAYS[2]]:{day:0,night:0},
    [DAYS[3]]:{day:0,night:0}, [DAYS[4]]:{day:0,night:0}, [DAYS[5]]:{day:0,night:0}, [DAYS[6]]:{day:0,night:0},
  },
  manualFTE: {}, // dateISO -> a real historical FTE figure imported from a spreadsheet, overrides the computed one
  syncedWeeks: [], // week-start ISO dates already folded into equity YTD, guards against double-counting
  // This roster reflects the unit's actual staff and stays. Shifts, requests, and census were a
  // single illustrative past week, not real data, so those start blank — bring in real history
  // with the spreadsheet or photo import on the Census & FTE tab, build weeks going forward in
  // Coverage, and let real census come from there or from staff submitting it in the Employee portal.
  nurses: [
    {id:"n1", name:"Laurie Swift",     role:"Manager", fte:1.0, cert:true,  pref:7,  nightsYTD:0, weekendsYTD:0, holidaysYTD:0, calloffs:0, ptoHonored:0, ptoDenied:0, prefHonored:0, prefDenied:0},
    {id:"n2", name:"Anthony Trocano",  role:"Manager", fte:1.0, cert:true,  pref:19, nightsYTD:0, weekendsYTD:0, holidaysYTD:0, calloffs:0, ptoHonored:0, ptoDenied:0, prefHonored:0, prefDenied:0},
    {id:"n3", name:"Christine Davis",  role:"RN",      fte:1.0, cert:true,  pref:9,  nightsYTD:0, weekendsYTD:0, holidaysYTD:0, calloffs:0, ptoHonored:0, ptoDenied:0, prefHonored:0, prefDenied:0},
    {id:"n4", name:"Kimberly Fritz",   role:"RN",      fte:1.0, cert:true,  pref:12, nightsYTD:0, weekendsYTD:0, holidaysYTD:0, calloffs:0, ptoHonored:0, ptoDenied:0, prefHonored:0, prefDenied:0},
    {id:"n5", name:"Mary Ronca",       role:"RN",      fte:1.0, cert:true,  pref:7,  nightsYTD:0, weekendsYTD:0, holidaysYTD:0, calloffs:0, ptoHonored:0, ptoDenied:0, prefHonored:0, prefDenied:0},
    {id:"n6", name:"Dawn Erickson",    role:"RN",      fte:1.0, cert:false, pref:7,  nightsYTD:0, weekendsYTD:0, holidaysYTD:0, calloffs:0, ptoHonored:0, ptoDenied:0, prefHonored:0, prefDenied:0},
    {id:"n7", name:"Edward Earvin",    role:"RN",      fte:1.0, cert:true,  pref:7,  nightsYTD:0, weekendsYTD:0, holidaysYTD:0, calloffs:0, ptoHonored:0, ptoDenied:0, prefHonored:0, prefDenied:0},
    {id:"n8", name:"Arnetta Sciulli",  role:"RN",      fte:0.5, cert:false, pref:21, nightsYTD:0, weekendsYTD:0, holidaysYTD:0, calloffs:0, ptoHonored:0, ptoDenied:0, prefHonored:0, prefDenied:0},
    {id:"n9", name:"Dyan Conaway",     role:"RN",      fte:1.0, cert:true,  pref:7,  nightsYTD:0, weekendsYTD:0, holidaysYTD:0, calloffs:0, ptoHonored:0, ptoDenied:0, prefHonored:0, prefDenied:0},
    {id:"n10",name:"Christina Stevens",role:"RN",      fte:1.0, cert:true,  pref:21, nightsYTD:0, weekendsYTD:0, holidaysYTD:0, calloffs:0, ptoHonored:0, ptoDenied:0, prefHonored:0, prefDenied:0},
    {id:"n11",name:"Faith Ndiga",      role:"RN",      fte:0.5, cert:false, pref:7,  nightsYTD:0, weekendsYTD:0, holidaysYTD:0, calloffs:0, ptoHonored:0, ptoDenied:0, prefHonored:0, prefDenied:0},
    {id:"p1", name:"Hemant Thapa", role:"Aide", fte:1.0, cert:false, pref:6, nightsYTD:0, weekendsYTD:0, holidaysYTD:0, calloffs:0, ptoHonored:0, ptoDenied:0, prefHonored:0, prefDenied:0},
    {id:"p2", name:"Kapil Sharma", role:"Aide", fte:0, cert:false, pref:6, nightsYTD:0, weekendsYTD:0, holidaysYTD:0, calloffs:0, ptoHonored:0, ptoDenied:0, prefHonored:0, prefDenied:0},
    {id:"p3", name:"General Sitter (pool, fills gaps)", role:"Aide", fte:0, cert:false, pref:6, nightsYTD:0, weekendsYTD:0, holidaysYTD:0, calloffs:0, ptoHonored:0, ptoDenied:0, prefHonored:0, prefDenied:0},
  ],
  assignments: [],
  requests: [],
};

let flashMessage = "";
let autoFillNote = ""; // result of the last auto-fill; cleared by any other change so it never goes stale
let confirmingClear = false;
let confirmingRemoveId = null;
let selDate = null, selStart = null, selEnd = null, pickingRange = false;

/* ---- undo: snapshots the mutable data (not view state like which week or tab you're on) ---- */
let undoStack = [];
const MAX_UNDO = 30;
function dataFields(){
  return {
    assignments: state.assignments, nurses: state.nurses, requests: state.requests,
    census: state.census, holidays: state.holidays, requirement: state.requirement,
    budget: state.budget, ratioTarget: state.ratioTarget, otThreshold: state.otThreshold,
    manualFTE: state.manualFTE, syncedWeeks: state.syncedWeeks,
    censusSubmissions: state.censusSubmissions, censusPrompt: state.censusPrompt,
  };
}
function snapshot(){
  autoFillNote = "";
  undoStack.push(JSON.parse(JSON.stringify(dataFields())));
  if(undoStack.length>MAX_UNDO) undoStack.shift();
  markDirty();
}
function undo(){
  if(!undoStack.length) return;
  Object.assign(state, undoStack.pop());
  confirmingClear=false; confirmingRemoveId=null; autoFillNote="";
  flashMessage = "Last change undone.";
  markDirty();
  render();
}
function renderUndoControl(){
  const el = document.getElementById("undoControl");
  if(!el) return;
  el.innerHTML = `<button class="btn secondary" style="padding:5px 10px;font-size:11.5px" onclick="undo()" ${undoStack.length?'':'disabled style="opacity:.4;cursor:default"'}>↺ Undo${undoStack.length?` (${undoStack.length})`:''}</button>`;
}

/* ---- persistence: the db capability when available (inside Claude's viewer, synced across
   viewers), else localStorage (this browser only, no sync — what a GitHub Pages copy of this
   file falls back to, since window.claude doesn't exist there). ----
   Single document/key = simplest possible model and always internally consistent (one write = the
   whole state, never a half-applied change split across pieces). The real cost on the db path:
   that store has no transactions, so if the manager and a nurse both save within the same instant,
   whichever write lands second overwrites the first's fields too, not just the ones that actually
   collided. For one manager plus a handful of staff saving a few times a minute, that's an
   acceptable near-term tradeoff, not a hidden one, this comment plus the visible sync status are
   the disclosure. Revisit with per-section documents once real accounts exist and concurrent
   editing is routine. The localStorage path has no such collision risk, because nothing else can
   write it, but for the same reason it also never syncs between people or devices — only between
   tabs of the same browser, via the native 'storage' event, wired in below. */
const LS_KEY = "empath-scheduler-state-v1";
let dbDoc = null, dbUnsub = null;
let persistMode = "none"; // "server" | "cloud" | "local" | "none" — decided once at boot, in initPersistence
let syncState = "loading"; // loading | saved | saving | dirty | unavailable | error
let dirty = false, saving = false, saveTimer = null;
let serverUpdatedAt = 0, serverPollTimer = null; // "server" mode only: last-seen write timestamp + polling handle
function renderSyncStatus(){
  const el = document.getElementById("syncStatus");
  if(!el) return;
  const localSuffix = persistMode==="local" ? " (this device only, won't sync or follow you elsewhere)" : "";
  const map = {
    loading:    ["Loading saved data…", "warn"],
    saved:      [`Saved${localSuffix}`, "ok"],
    saving:     ["Saving…", "warn"],
    dirty:      ["Unsaved changes…", "warn"],
    unavailable:["Not saved — this browser won't keep changes after you leave", "bad"],
    error:      ["Save failed, retrying…", "bad"],
  };
  const [label,cls] = map[syncState] || ["",""];
  el.innerHTML = label ? `<span class="flag ${cls}" style="font-size:10.5px" title="${cls==='bad'?'Changes only last until you close or refresh this tab.':''}">${label}</span>` : "";
}
function markDirty(){
  if(persistMode==="none"){ syncState = syncState==="loading" ? "loading" : "unavailable"; renderSyncStatus(); return; }
  dirty = true;
  syncState = "dirty";
  renderSyncStatus();
  scheduleSave();
}
function scheduleSave(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 900);
}
async function doSave(){
  if(persistMode==="none" || saving){ return; } // if a save is already in flight, its own completion re-checks `dirty` and reschedules
  if(!dirty) return;
  saving = true; dirty = false;
  syncState = "saving"; renderSyncStatus();
  try{
    if(persistMode==="server"){
      const res = await fetch("/api/state", {
        method:"PUT",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ data: dataFields() }),
      });
      if(!res.ok) throw new Error("save failed: "+res.status);
      const body = await res.json();
      serverUpdatedAt = body.updatedAt;
    } else if(persistMode==="cloud"){
      await dbDoc.set(dataFields());
    } else {
      localStorage.setItem(LS_KEY, JSON.stringify(dataFields()));
    }
    syncState = dirty ? "dirty" : "saved";
  } catch(e){
    dirty = true; // put it back, this attempt didn't land
    syncState = "error";
  } finally {
    saving = false;
    renderSyncStatus();
    if(dirty) scheduleSave();
  }
}
function applyLoadedData(data){
  if(!data || typeof data!=="object") return;
  // Field by field, so an older saved shape (missing a field this version added) just keeps
  // that field's seeded default instead of wiping it or crashing.
  Object.keys(dataFields()).forEach(k=>{ if(data[k]!==undefined) state[k] = data[k]; });
}
async function initPersistence(){
  // Path 0: this copy of the page is being served by its own backend (the Fly.io deployment, if
  // you've set one up) — real server-side persistence in a database file, independent of any one
  // browser, and synced across every device that opens this URL. A static copy of this same file
  // (GitHub Pages, opened from disk, the Claude artifact viewer) has no /api/state to answer this,
  // so the fetch below either 404s or errors out and we fall through to the other paths below.
  try{
    const probe = await fetch("/api/state", { headers:{ Accept:"application/json" } });
    if(probe.ok){
      const body = await probe.json();
      persistMode = "server";
      if(body && body.data){ applyLoadedData(body.data); flashMessage = "Loaded your saved data."; }
      serverUpdatedAt = (body && body.updatedAt) || 0;
      syncState = "saved";
      render();
      serverPollTimer = setInterval(pollServerState, 5000);
      return;
    }
  } catch(e){ /* no backend here — not an error, just means this isn't the Fly-hosted copy */ }
  // Path 1: the db capability, only real inside Claude's viewer, and syncs across everyone with the page open.
  if(typeof claude!=="undefined"){
    let db;
    try{ db = await claude.use("db"); } catch(e){ db = null; }
    if(db){
      dbDoc = db.doc("appstate/main");
      persistMode = "cloud";
      try{
        const snap = await dbDoc.get();
        if(snap.exists){ applyLoadedData(snap.data()); flashMessage = "Loaded your saved data."; }
      } catch(e){ /* no saved copy yet, or a transient read error — proceed with the seeded starting data */ }
      syncState = "saved";
      render();
      dbUnsub = dbDoc.onSnapshot(snap=>{
        if(!snap.exists || snap.metadata.hasPendingWrites) return; // ignore the echo of our own unconfirmed write
        applyLoadedData(snap.data());
        render();
      }, ()=>{ syncState="error"; renderSyncStatus(); });
      return;
    }
  }
  // Path 2: no db (e.g. this file hosted plainly, on GitHub Pages or opened straight from disk) —
  // fall back to this browser's own localStorage, so at least this one person's own device keeps
  // their data between visits, even though it can't sync to anyone else or follow them elsewhere.
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ applyLoadedData(JSON.parse(raw)); flashMessage = "Loaded your saved data from this browser."; }
    persistMode = "local";
    syncState = "saved";
    window.addEventListener("storage", e=>{
      if(e.key!==LS_KEY || !e.newValue) return; // fires in OTHER tabs of this same browser when one of them saves
      try{ applyLoadedData(JSON.parse(e.newValue)); render(); } catch(err){}
    });
  } catch(e){
    // localStorage can throw (private/incognito mode with storage blocked, or a sandboxed frame) —
    // degrade to no persistence at all rather than crash the app over it.
    persistMode = "none";
    syncState = "unavailable";
  }
  render();
}
// "server" mode only: short-polls for changes written by someone else (another device, another
// tab). Skips a tick while a local save is in flight or pending, so it never clobbers an edit
// that just hasn't reached the server yet — exactly the same "ignore our own unconfirmed write"
// guard the "cloud" path gets for free from onSnapshot.
async function pollServerState(){
  if(saving || dirty) return;
  try{
    const res = await fetch("/api/state", { headers:{ Accept:"application/json" } });
    if(!res.ok) return;
    const body = await res.json();
    if(body && body.updatedAt && body.updatedAt > serverUpdatedAt){
      serverUpdatedAt = body.updatedAt;
      if(body.data){ applyLoadedData(body.data); render(); }
    }
  } catch(e){ /* a dropped poll just tries again in 5s */ }
}

/* ============ HELPERS ============ */
let xlsxLoadPromise = null;
function ensureXLSX(){
  if(typeof XLSX!=="undefined") return Promise.resolve(true);
  if(xlsxLoadPromise) return xlsxLoadPromise;
  xlsxLoadPromise = new Promise(resolve=>{
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = ()=>resolve(true);
    s.onerror = ()=>resolve(false);
    document.head.appendChild(s);
  });
  return xlsxLoadPromise;
}
function nurse(id){ return state.nurses.find(n=>n.id===id); }
function isWeekend(iso){ const day = new Date(iso+"T00:00:00").getDay(); return day===0 || day===6; }
function isHoliday(iso){ return state.holidays.includes(iso); }

function occupiedByDate(a){
  const out = {};
  for(let h=0; h<a.duration; h++){
    const hour = (a.start+h)%24;
    const dayOffset = Math.floor((a.start+h)/24);
    const d = addDays(a.date, dayOffset);
    (out[d] = out[d]||[]).push(hour);
  }
  return out;
}
function coverageForDate(dateISO, roleFilter){
  const cov = Array(24).fill(0);
  const who = Array.from({length:24}, ()=>[]);
  state.assignments.forEach(a=>{
    const n = nurse(a.nurseId);
    if(roleFilter && (!n || !roleFilter(n))) return;
    const occ = occupiedByDate(a);
    if(occ[dateISO]) occ[dateISO].forEach(h=>{ cov[h]++; who[h].push(a.nurseId); });
  });
  return {cov, who};
}
// Hours where a shift starts or ends, for this date — used to draw visible breaks on the coverage strip
// so individual shifts are identifiable at a glance, not just a solid block of color.
function shiftBoundaryHours(dateISO, roleFilter){
  const boundaries = new Set();
  state.assignments.forEach(a=>{
    const n = nurse(a.nurseId);
    if(roleFilter && (!n || !roleFilter(n))) return;
    const occ = occupiedByDate(a)[dateISO];
    if(!occ || !occ.length) return;
    const sorted = [...occ].sort((x,y)=>x-y);
    boundaries.add(sorted[0]);                 // this shift starts here
    if(sorted[sorted.length-1]+1 <= 23) boundaries.add(sorted[sorted.length-1]+1); // this shift ends here
  });
  return boundaries;
}
function requiredForHour(h){ return Math.max((h>=7 && h<19) ? state.requirement.day : state.requirement.night, state.requirement.floor); }
function avgStaffForBand(dateISO, startH, lenH){
  const {cov} = coverageForDate(dateISO, n=>n.role!=="Aide");
  let total=0;
  for(let i=0;i<lenH;i++) total += cov[(startH+i)%24];
  return total/lenH;
}
function weeklyHoursFor(nurseId){ return state.assignments.filter(a=>a.nurseId===nurseId && DAYS.includes(a.date)).reduce((s,a)=>s+a.duration,0); }
function requiredFTE(){
  let totalHours=0;
  DAYS.forEach(()=>{ for(let h=0;h<24;h++) totalHours += requiredForHour(h); });
  return totalHours/36;
}
function availableFTE(){ return state.nurses.filter(n=>n.role!=="Manager" && n.role!=="Aide").reduce((s,n)=>s+n.fte,0); }
function approvedPTO(nurseId,date){ return state.requests.some(r=>r.nurseId===nurseId && r.date===date && (r.type==="PTO" || r.type==="Off") && r.status==="approved"); }
function toAbs(date,hour){ return (new Date(date+"T00:00:00")).getTime()/3600000 + hour; }
function restViolation(nurseId, date, start, duration, excludeId){
  const others = state.assignments.filter(a=>a.nurseId===nurseId && a.id!==excludeId);
  const newStart = toAbs(date,start), newEnd = newStart+duration;
  for(const o of others){
    const oStart = toAbs(o.date,o.start), oEnd = oStart+o.duration;
    if(!(newEnd<=oStart || newStart>=oEnd)) return "overlap";
    const gap = newStart>=oEnd ? newStart-oEnd : oStart-newEnd;
    if(gap>=0 && gap<10) return "rest";
  }
  return null;
}

/* ---- equity score, corrected ---- */
// Higher score = more burden the UNIT has imposed on this nurse (undesirable shifts, denied PTO,
// denied shift-preference requests) minus benefits already received (approved PTO, approved shift
// preferences). Holidays are weighted above weekends, above nights, matching the common real-world
// ordering of how contested these shifts are. Overtime is deliberately NOT in this score: it's
// separately compensated at 1.5x, unlike an undesirable shift worked at base rate, so it isn't the
// same kind of burden. If your staff feels being asked to work OT is unfair regardless of the extra
// pay, that's a weight to add with their input, not something to assume. Call-offs are NOT included
// either: that's the nurse's own reliability record, not something the unit did to them.
function scoreBreakdown(n){
  return [
    {label:"Nights worked YTD",         detail:`${n.nightsYTD} × 1.0`,  points:n.nightsYTD*1.0},
    {label:"Weekends worked YTD",       detail:`${n.weekendsYTD} × 1.4`, points:n.weekendsYTD*1.4},
    {label:"Holidays worked YTD",       detail:`${n.holidaysYTD} × 2.0`, points:n.holidaysYTD*2.0},
    {label:"PTO requests denied",       detail:`${n.ptoDenied} × 1.5`,  points:n.ptoDenied*1.5},
    {label:"PTO requests approved",     detail:`${n.ptoHonored} × -1.0`, points:-n.ptoHonored*1.0},
    {label:"Shift preferences denied",  detail:`${n.prefDenied} × 1.0`,  points:n.prefDenied*1.0},
    {label:"Shift preferences honored", detail:`${n.prefHonored} × -0.5`, points:-n.prefHonored*0.5},
  ];
}
function equityScore(n){ return scoreBreakdown(n).reduce((s,x)=>s+x.points,0); }

/* ---- Coverage tab ---- */
function coverageTab(){
  const stripRows = DAYS.map((d,i)=>{
    const {cov,who} = coverageForDate(d, n=>n.role!=="Aide");
    const edges = shiftBoundaryHours(d, n=>n.role!=="Aide");
    const ticks = cov.map((c,h)=>{
      const req = requiredForHour(h);
      let cls = c>=req ? "ok" : "short";
      if(c===0) cls += " floor-fail";
      if(edges.has(h)) cls += " shift-edge";
      if(selDate===d && selStart!==null && h>=Math.min(selStart,selEnd) && h<=Math.max(selStart,selEnd)) cls += " selected";
      const names = esc(who[h].map(id=>nurse(id)?.name.split(" ")[0]).join(", ") || "no one");
      return `<div class="tick ${cls}" data-tip="${fmtHour(h)}: ${c} on / ${req} required — ${names}" onclick="tickClick('${d}',${h})"></div>`;
    }).join("");
    const holidayTag = isHoliday(d) ? `<br><span class="pill" style="background:var(--amber-soft);color:var(--amber)">Holiday</span>` : "";
    return `<div class="cov-day"><div class="lbl">${DAY_NAMES[i]}<br><span style="font-family:var(--mono);font-size:10.5px">${d.slice(5)}</span>${holidayTag}</div><div class="cov-ticks">${ticks}</div></div>`;
  }).join("");

  const axis = Array.from({length:24},(_,h)=> h%3===0 ? `<div>${fmtHour(h)}</div>` : `<div></div>`).join("");

  const scheduleRows = state.nurses.map(n=>{
    const hrs = weeklyHoursFor(n.id);
    const otTag = hrs>state.otThreshold ? `<span class="pill" style="background:var(--rust-soft);color:var(--rust)">OT +${hrs-state.otThreshold}h</span>` : "";
    const cells = DAYS.map(d=>{
      const shifts = state.assignments.filter(a=>a.nurseId===n.id && a.date===d);
      const chips = shifts.map(a=>{
        const isNight = a.start>=19 || a.start<7;
        return `<span class="chip ${isNight?'night':''}">${fmtHour(a.start)}–${fmtHour((a.start+a.duration)%24)}
          <button onclick="removeAssignment('${a.id}')" title="Remove">✕</button></span>`;
      }).join("");
      return `<td class="daycell">${chips}<br><button class="add-shift" onclick="openAddShift('${n.id}','${d}')">+ shift</button></td>`;
    }).join("");
    return `<tr><td><strong>${esc(n.name)}</strong><br><span class="pill ${n.role==='Manager'?'mgr':n.role==='Aide'?'aide':'rn'}">${n.role}</span> ${n.fte<1 && n.role!=='Aide'?'<span class="pill pt">PT</span>':''} ${otTag}</td>${cells}</tr>`;
  }).join("");

  return `
    <div class="panel">
      <h2>Editable weekly schedule</h2>
      <p class="desc">Every nurse can have a fully custom start time and shift length, nothing is locked to a fixed 7-7 or 9-9 block unless you set it that way. A rust "OT" tag means this nurse is scheduled past ${state.otThreshold} hours this week, federal overtime territory under FLSA, at 1.5x pay on the excess. Adding a shift never blocks on this, it's a flag for you to weigh, not a hard rule.</p>
      ${weekNavControlHTML()}
      <div style="overflow-x:auto;">
        <table><thead><tr><th>Nurse</th>${DAY_NAMES.map((d,i)=>`<th>${d} ${DAYS[i].slice(5)}</th>`).join("")}</tr></thead>
        <tbody>${scheduleRows}</tbody></table>
      </div>
      <div id="addShiftForm"></div>
      <div class="row" style="margin-top:14px;">
        <button class="btn secondary" onclick="exportShiftsFile()">Export shifts (.xlsx)</button>
      </div>
      <div id="exportResult" style="margin-top:8px"></div>
    </div>

    <div class="panel">
      <h2>Hourly coverage</h2>
      ${weekNavControlHTML()}
      <p class="desc">Each tick is one hour. Tap or click a tick to reassign or add coverage there; tap a second tick in the same day to select everything between them (no modifier key needed, works with mouse or finger). Green meets the requirement for that hour; rust is short; outlined rust is zero coverage, a hard floor failure. A dark left edge marks where a shift actually starts or ends. Hover or tap-and-hold a tick to see who's on. Amber "Holiday" tags mark configured holidays, edit the list in Census &amp; FTE.</p>
      ${stripRows}
      <div class="hour-axis"><div></div><div class="ha">${axis}</div></div>
      <div class="legend">
        <span><span class="swatch" style="background:var(--green);opacity:.55"></span> meets requirement</span>
        <span><span class="swatch" style="background:var(--rust)"></span> below requirement</span>
        <span><span class="swatch" style="background:var(--rust);box-shadow:0 0 0 1.5px var(--rust) inset"></span> zero coverage (floor violation)</span>
      </div>
      <div id="hourEditor"></div>
      <div class="row" style="margin-top:14px;">
        <div><label>Day band required (7a–7p)</label><input type="number" min="0" value="${state.requirement.day}" style="width:70px" onchange="setReq('day',this.value)"></div>
        <div><label>Night band required (7p–7a)</label><input type="number" min="0" value="${state.requirement.night}" style="width:70px" onchange="setReq('night',this.value)"></div>
        <div><label>Absolute floor, any hour</label><input type="number" min="1" value="${state.requirement.floor}" style="width:70px" onchange="setReq('floor',this.value)"></div>
        <div><label>Aide floor, always on</label><input type="number" min="1" value="${state.requirement.aideFloor}" style="width:70px" onchange="setReq('aideFloor',this.value)"></div>
      </div>
    </div>

    <div class="panel">
      <h2>Auto-fill gaps</h2>
      <p class="desc">A rule-based heuristic, not a real optimizer. It only adds shifts to close shortfalls, it never changes or removes anything you've already scheduled, and it never touches aide coverage (aides self-schedule).</p>
      <ul class="desc" style="margin:0 0 10px 18px;padding:0;list-style:disc;">
        <li>Checks every hour of each day/night band, not just the start, so a shorter shift that leaves a gap partway through still gets caught.</li>
        <li>Closes one gap at a time with a standard-length shift (8h if the gap is narrow, 12h if it spans more of the band) sized and placed to cover just that gap, instead of always stacking a full 12-hour shift from the band's start, which used to overstaff the band's easier hours.</li>
        <li>Only considers nurses who are free: not already on shift, not on approved PTO, rest-compliant (10+ hours since their last shift), and under a hard 60-hour weekly cap (only crossed if every eligible option for that specific gap is already past it, so a gap never goes unfilled over it, flagged in the summary when it happens).</li>
        <li>Among those, ranks by: fatigue first (anyone already on a 3rd+ consecutive working day goes last, not excluded, so a gap still gets filled if they're the only option); for a night-band gap, fewest nights already carried (year-to-date plus this run) next, to actively rotate who takes nights rather than leaving it to chance; then shift-time preference match; then fewest hours already scheduled this week; then lowest equity score (least burden carried so far). There's no manager-coverage rule — a shift doesn't need a manager on it, managers are ranked the same as anyone else.</li>
        <li>Swaps in a certified nurse for the gap it's filling if no one already covering that window is certified.</li>
      </ul>
      <div class="row">
        <button class="btn" onclick="runAutoFill()">Auto-fill gaps</button>
        ${confirmingClear
          ? `<span class="flag bad">Clear all shifts this week?</span><button class="btn danger" onclick="confirmClearYes()">Yes, clear</button><button class="btn secondary" onclick="confirmClearNo()">Cancel</button>`
          : `<button class="btn secondary" onclick="clearWeek()">Clear week</button>`}
      </div>
      ${autoFillNote ? `<div class="flag warn block" style="margin-top:10px">${autoFillNote}</div>` : ""}
    </div>
  `;
}

function confirmAddShift(nurseId,date){

function openHourEditor(){

  const lo = Math.min(selStart,selEnd), hi = Math.max(selStart,selEnd);
  const covering = state.assignments.filter(a=>{

  });
  const rows = covering.map(a=>`

/* ---- Auto-fill heuristic ---- */
function shortHoursInWeek(){
  let s=0;
  DAYS.forEach(dt=>{ const c=coverageForDate(dt, n=>n.role!=="Aide").cov; for(let h=0;h<24;h++) if(c[h]<requiredForHour(h)) s++; });
  return s;
}
// Consecutive calendar days with any shift, counting backward from (but not including) `date`.
// Used as a soft fatigue tie-break: capping consecutive 12-hour shifts at 3 before a rest day is
// standard shift-scheduling guidance (ANA/NIOSH fatigue-management recommendations), so a nurse
// already on day 3+ gets ranked behind anyone equally eligible but less stacked, without ever being
// excluded outright, auto-fill still has to close the gap from whoever's actually available.
function consecutiveDaysWorked(nurseId, date){
  let n = 0, cur = date;
  while(true){
    cur = addDays(cur, -1);
    if(state.assignments.some(a=>a.nurseId===nurseId && a.date===cur)) n++; else break;
  }
  return n;
}
function runAutoFill(){
  snapshot();
  const bands = [{start:7,label:"day"},{start:19,label:"night"}];
  const shortBefore = shortHoursInWeek();
  // Monday's early-morning hours (12a-7a) are covered by a shift that starts the Sunday night before,
  // which sits just outside the week on screen. Plan that night band too, counting only the hours that land in this week.
  const plan = [{d:addDays(DAYS[0],-1), b:bands[1], weekOnly:true}];
  DAYS.forEach(d=>bands.forEach(b=>plan.push({d,b,weekOnly:false})));
  let added = 0, addedBefore = 0, uncoverable = 0, capOverridden = 0;
  const nightsThisRun = {}; // nurseId -> night-band shifts added so far in this run, for fair-rotation ranking below
  // Hard safety ceiling on top of the OT threshold's soft tie-break: without this, a nurse who keeps
  // winning the ranking (best preference match, fewest hours *before* this run started, etc.) can get
  // picked for gap after gap in the same run and end up stacked to 70+ hours in one week. 60h/week is
  // a standard outer bound in shift-scheduling fatigue guidance; it's enforced here as a filter, with a
  // fallback to override it only when literally nobody else is free, so a gap never silently goes
  // unfilled because of it.
  const HARD_WEEKLY_CAP = 60;
  plan.forEach(({d,b,weekOnly})=>{
    // The band's 12 real (date,hour) cells, trimmed to this week when weekOnly is set. Built once;
    // coverage within it is re-read live on every pass below so a shift just added in this band
    // counts immediately, instead of computing one peak shortfall up front and blanket-filling it.
    const cells = [];
    for(let h=0; h<12; h++){
      const hour = (b.start+h)%24;
      const dayOffset = Math.floor((b.start+h)/24);
      const checkDate = dayOffset===0 ? d : addDays(d, dayOffset);
      if(weekOnly && !DAYS.includes(checkDate)) continue;
      cells.push({hour, date:checkDate});
    }
    if(!cells.length) return;
    const deficitAt = c => requiredForHour(c.hour) - coverageForDate(c.date, n=>n.role!=="Aide").cov[c.hour];

    // Close one gap at a time until the band is fully covered or nobody's left to cover it with.
    for(let guard=0; guard<24; guard++){
      let worstIdx = -1, worstDeficit = 0;
      cells.forEach((c,i)=>{ const def = deficitAt(c); if(def>worstDeficit){ worstDeficit = def; worstIdx = i; } });
      if(worstIdx===-1) break; // band fully covered

      // Grow outward from the worst hour across the contiguous run of still-short hours, so the new
      // shift is sized to the actual gap instead of always spanning the whole band.
      let lo = worstIdx, hi = worstIdx;
      while(lo>0 && deficitAt(cells[lo-1])>0) lo--;
      while(hi<cells.length-1 && deficitAt(cells[hi+1])>0) hi++;
      const gapLen = hi-lo+1;
      // Use a standard 8-hour shift when the gap is narrow; fall back to a full 12-hour shift (from
      // the band's start) when it spans more than that. Either way the shift stays inside this band's
      // cells so it never overstaffs hours that are already covered — the main tradeoff with always
      // using a single full-length shift from the band's start.
      const span = Math.min(gapLen<=8 ? 8 : 12, cells.length);
      const startIdx = Math.max(0, Math.min(lo, cells.length-span));
      const startCell = cells[startIdx];

      let eligible = state.nurses.filter(n=>{
        if(n.role==="Aide") return false; // aides self-schedule, auto-fill doesn't touch their coverage
        if(approvedPTO(n.id, startCell.date)) return false;
        if(restViolation(n.id, startCell.date, startCell.hour, span)) return false; // also catches overlap with an existing shift
        return true;
      });
      if(!eligible.length){ uncoverable++; break; } // nobody left who can take this gap, stop and let the summary report it

      const underCap = eligible.filter(n=>weeklyHoursFor(n.id)+span<=HARD_WEEKLY_CAP);
      if(underCap.length) eligible = underCap;
      else capOverridden++; // every remaining option would cross 60h/week — fill it anyway rather than leave the gap open

      eligible.sort((a,c)=>{
        const consA = consecutiveDaysWorked(a.id, startCell.date)>=3 ? 1:0, consC = consecutiveDaysWorked(c.id, startCell.date)>=3 ? 1:0;
        if(consA!==consC) return consA-consC; // fatigue guard: 3-in-a-row goes last, never excluded outright
        // Night-band gaps rank by who's carried the fewest nights (YTD plus whatever this run has
        // already handed them), ahead of preference match — the direct lever for "fairly distribute
        // night shifts" rather than leaving it to equityScore's broader, lower-weighted mix.
        if(b.label==="night"){
          const nightsA = (a.nightsYTD||0)+(nightsThisRun[a.id]||0), nightsC = (c.nightsYTD||0)+(nightsThisRun[c.id]||0);
          if(nightsA!==nightsC) return nightsA-nightsC;
        }
        const prefA = Math.abs(a.pref-b.start)<=2 ? 0:1, prefC = Math.abs(c.pref-b.start)<=2 ? 0:1;
        if(prefA!==prefC) return prefA-prefC;
        const hoursA = weeklyHoursFor(a.id), hoursC = weeklyHoursFor(c.id);
        if(hoursA!==hoursC) return hoursA-hoursC;
        return equityScore(a)-equityScore(c);
      });

      let pick = eligible[0];
      // If nobody already covering this specific window is certified, prefer a certified nurse for it.
      const onDuty = new Set();
      cells.slice(startIdx, startIdx+span).forEach(c=>{ coverageForDate(c.date, n=>n.role!=="Aide").who[c.hour].forEach(id=>onDuty.add(id)); });
      const blockCertified = [...onDuty].some(id=>nurse(id)?.cert) || pick.cert;
      if(!blockCertified){
        const certPick = eligible.find(n=>n.cert);
        if(certPick) pick = certPick;
      }

      state.assignments.push({id:"a"+Math.random().toString(36).slice(2), nurseId:pick.id, date:startCell.date, start:startCell.hour, duration:span});
      added++; if(weekOnly) addedBefore++;
      if(b.label==="night") nightsThisRun[pick.id] = (nightsThisRun[pick.id]||0)+1;
    }
  });
  const shortAfter = shortHoursInWeek();
  const hrs = n=>`${n} hour${n===1?"":"s"}`;
  autoFillNote = (added
      ? `Auto-fill added ${added} shift${added===1?"":"s"}${addedBefore?` (${addedBefore} of them start the Sunday night before this week, to cover Monday's early hours)`:""}, taking short hours from ${shortBefore} to ${shortAfter}. `
      : `Auto-fill had nothing it could add. `)
    + (shortAfter
      ? `${hrs(shortAfter)} still below requirement: nobody is free for them (approved time off, rest rules, or already on shift). Add coverage by hand, or lower the requirement. `
      : `Every nurse hour this week now meets the requirement. `)
    + (capOverridden ? `${capOverridden} shift${capOverridden===1?"":"s"} had to cross the 60h/week safety cap anyway, because every eligible nurse for that gap was already past it. Check those by hand. ` : "")
    + `Aide coverage isn't touched by auto-fill.`;
  render();
}

function setCensus(date,field,val){ snapshot(); if(!state.census[date]) state.census[date]={day:0,night:0}; state.census[date][field]=Number(val); render(); }
async function handleSpreadsheetUpload(input){
  const file = input.files[0];
  if(!file) return;
  flashMessage = "Reading file…"; render();
  if(!(await ensureXLSX())){
    flashMessage = "Couldn't load the spreadsheet library, check your connection and try again.";
    render();
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const wb = XLSX.read(new Uint8Array(e.target.result), {type:"array", cellDates:true});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:null});
      if(!rows.length){ flashMessage = "That sheet has no rows."; render(); return; }
      let imported=0, skipped=0;
      snapshot();
      rows.forEach(row=>{
        const keys = Object.keys(row);
        const dateKey = keys.find(k=>/date/i.test(k));
        const dayKey = keys.find(k=>/day/i.test(k) && /cens/i.test(k)) || keys.find(k=>/^day$/i.test(k));
        const nightKey = keys.find(k=>/night/i.test(k) && /cens/i.test(k)) || keys.find(k=>/^night$/i.test(k));
        const fteKey = keys.find(k=>/fte/i.test(k));
        if(!dateKey || row[dateKey]==null){ skipped++; return; }
        let raw = row[dateKey], iso;
        if(raw instanceof Date && !isNaN(raw)) iso = raw.toISOString().slice(0,10);
        else { const d = new Date(raw); if(isNaN(d)){ skipped++; return; } iso = d.toISOString().slice(0,10); }
        const day = dayKey && row[dayKey]!=null ? Number(row[dayKey]) : 0;
        const night = nightKey && row[nightKey]!=null ? Number(row[nightKey]) : 0;
        state.census[iso] = {day: isNaN(day)?0:day, night: isNaN(night)?0:night};
        if(fteKey && row[fteKey]!=null && row[fteKey]!==""){
          const f = Number(row[fteKey]);
          if(!isNaN(f)) state.manualFTE[iso] = f;
        }
        imported++;
      });
      flashMessage = `Imported ${imported} date${imported===1?'':'s'}${skipped?`, skipped ${skipped} row${skipped===1?'':'s'} with no readable date`:''}.`;
      input.value = "";
      render();
    } catch(err){
      flashMessage = `Couldn't read that file (${err.message}). Needs to be a real .xlsx or .csv with a Date column.`;
      render();
    }
  };
  reader.readAsArrayBuffer(file);
}
function parseHourLabel(v){
  if(v==null || v==="") return null;
  if(v instanceof Date && !isNaN(v)) return v.getHours();
  if(typeof v==="number" && !isNaN(v)) return ((Math.round(v)%24)+24)%24;
  const s = String(v).trim().toLowerCase();
  let m = s.match(/^(\d{1,2})\s*(a|am|p|pm)$/);
  if(m){ let h = Number(m[1])%12; if(m[2][0]==='p') h += 12; return h; }
  m = s.match(/^(\d{1,2}):(\d{2})/);
  if(m) return Number(m[1])%24;
  const n = Number(s);
  return isNaN(n) ? null : ((Math.round(n)%24)+24)%24;
}
async function handleScheduleUpload(input){

      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:null});
      if(!rows.length){ flashMessage = "That sheet has no rows."; render(); return; }
      let imported=0, duplicates=0;
      const skippedNames = new Set(), badDates = [], badTimes = [];
      snapshot();
      rows.forEach((row,i)=>{
        const keys = Object.keys(row);
        const dateKey = keys.find(k=>/date/i.test(k));
        const nurseKey = keys.find(k=>/nurse/i.test(k)) || keys.find(k=>/name/i.test(k));
        const startKey = keys.find(k=>/^start$/i.test(k)) || keys.find(k=>/start/i.test(k));
        const endKey = keys.find(k=>/^end$/i.test(k)) || keys.find(k=>/end/i.test(k));
        const durKey = keys.find(k=>/duration/i.test(k)) || keys.find(k=>/hours|hrs/i.test(k));
        if(!dateKey || !nurseKey || row[dateKey]==null || row[nurseKey]==null) return;
        let iso;
        const raw = row[dateKey];
        if(raw instanceof Date && !isNaN(raw)) iso = isoLocal(raw);
        else { const d = new Date(raw); if(isNaN(d)){ badDates.push(`row ${i+2}`); return; } iso = isoLocal(d); }
        const name = String(row[nurseKey]).trim().toLowerCase();
        const n = state.nurses.find(x=>x.name.trim().toLowerCase()===name);
        if(!n){ skippedNames.add(String(row[nurseKey]).trim()); return; }
        const start = startKey!=null ? parseHourLabel(row[startKey]) : null;
        if(start==null){ badTimes.push(`row ${i+2}`); return; }
        let duration = durKey!=null && row[durKey]!=null ? Number(String(row[durKey]).replace(/[^0-9.]/g,"")) : null;
        if((duration==null || isNaN(duration)) && endKey!=null){
          const end = parseHourLabel(row[endKey]);
          if(end!=null) duration = ((end - start + 24) % 24) || 24;
        }
        if(duration==null || isNaN(duration) || duration<=0){ badTimes.push(`row ${i+2}`); return; }
        duration = Math.min(24, duration);
        const already = state.assignments.some(a=>a.nurseId===n.id && a.date===iso && a.start===start && a.duration===duration);
        if(already){ duplicates++; return; }
        state.assignments.push({id:"a"+Math.random().toString(36).slice(2), nurseId:n.id, date:iso, start, duration});
        imported++;
      });
      const notes = [];
      if(duplicates) notes.push(`${duplicates} already on the schedule, skipped`);
      if(skippedNames.size) notes.push(`${skippedNames.size} name${skippedNames.size===1?"":"s"} not found in Roster: ${[...skippedNames].join(", ")}`);
      if(badDates.length) notes.push(`${badDates.length} row(s) with an unreadable date (${badDates.slice(0,5).join(", ")}${badDates.length>5?"…":""})`);
      if(badTimes.length) notes.push(`${badTimes.length} row(s) with an unreadable start time or duration (${badTimes.slice(0,5).join(", ")}${badTimes.length>5?"…":""})`);
      flashMessage = `Imported ${imported} shift${imported===1?"":"s"}.${notes.length?" "+notes.join("; ")+".":""}`;
      input.value = "";
      render();
    } catch(err){
      flashMessage = `Couldn't read that file (${err.message}). Needs to be a real .xlsx or .csv with Date and Nurse columns.`;
      render();
    }
  };
  reader.readAsArrayBuffer(file);
}
/* ---- image import: photo of a schedule -> structured shifts, via the server's vision call ---- */
let pendingImageImport = null; // {candidates:[{nurseId,nurseName,date,start,duration}], notes:[string]}
function downscaleImageToJPEGBase64(file, maxDim=1600, quality=0.82){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      let {width,height} = img;
      if(width>maxDim || height>maxDim){
        const scale = maxDim/Math.max(width,height);
        width = Math.round(width*scale); height = Math.round(height*scale);
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      canvas.getContext("2d").drawImage(img,0,0,width,height);
      URL.revokeObjectURL(url);
      const dataUrl = canvas.toDataURL("image/jpeg", quality);
      resolve(dataUrl.split(",")[1]);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("couldn't read that image file")); };
    img.src = url;
  });
}
async function handleScheduleImageUpload(input){
  const file = input.files[0];
  if(!file) return;
  flashMessage = "Reading photo and matching it against your roster, this can take a few seconds…";
  pendingImageImport = null;
  render();
  try{
    const imageBase64 = await downscaleImageToJPEGBase64(file);
    const res = await fetch("/api/parse-schedule-image", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ imageBase64, mediaType:"image/jpeg" }),
    });
    const body = await res.json();
    if(!res.ok){ flashMessage = body.error || "Couldn't read that photo."; input.value=""; render(); return; }
    const shifts = Array.isArray(body.shifts) ? body.shifts : [];
    if(!shifts.length){ flashMessage = "Didn't find any readable shifts in that photo. Try a clearer or better-lit photo."; input.value=""; render(); return; }
    const candidates = [], notes = [];
    const unmatchedNames = new Set(), badDates = [], badTimes = [];
    shifts.forEach((s,i)=>{
      if(!s || !s.date || !s.nurse){ return; }
      const d = new Date(s.date+"T00:00:00");
      if(isNaN(d)){ badDates.push(`#${i+1} (${s.date})`); return; }
      const iso = isoLocal(d);
      const name = String(s.nurse).trim().toLowerCase();
      const n = state.nurses.find(x=>x.name.trim().toLowerCase()===name)
        || state.nurses.find(x=>x.name.trim().toLowerCase().includes(name) || name.includes(x.name.trim().toLowerCase()));
      if(!n){ unmatchedNames.add(String(s.nurse).trim()); return; }
      const start = parseHourLabel(s.start);
      if(start==null){ badTimes.push(`${s.nurse} on ${iso}`); return; }
      let duration = 12; // sane default when the model couldn't read an end time
      if(s.end){ const end = parseHourLabel(s.end); if(end!=null) duration = ((end-start+24)%24) || 24; }
      const already = state.assignments.some(a=>a.nurseId===n.id && a.date===iso && a.start===start && a.duration===duration);
      candidates.push({ nurseId:n.id, nurseName:n.name, date:iso, start, duration, duplicate:already });
    });
    if(unmatchedNames.size) notes.push(`${unmatchedNames.size} name${unmatchedNames.size===1?"":"s"} not found in Roster: ${[...unmatchedNames].join(", ")}`);
    if(badDates.length) notes.push(`${badDates.length} shift(s) with an unreadable date`);
    if(badTimes.length) notes.push(`${badTimes.length} shift(s) with an unreadable start time`);
    if(!candidates.length){ flashMessage = `Read the photo but couldn't match any shifts to your roster.${notes.length?" "+notes.join("; ")+".":""}`; input.value=""; render(); return; }
    pendingImageImport = { candidates, notes };
    flashMessage = "";
    input.value = "";
    render();
  } catch(err){
    flashMessage = `Couldn't read that photo (${err.message}).`;
    input.value = "";
    render();
  }
}

function applySuggestedRequirement(){
  let dayVals=[], nightVals=[];
  DAYS.forEach(d=>{
    const c = state.census[d]||{day:0,night:0};
    dayVals.push(Math.max(1,Math.ceil(c.day/state.ratioTarget)));

/* ---- small inline SVG line chart, no external library ---- */
function lineChartSVG(series, xLabels, opts={}){
  const W=620,H=170,padL=36,padR=10,padT=10,padB=22;
  const allVals = series.flatMap(s=>s.values).concat(opts.band?[opts.band[0],opts.band[1]]:[]);
  const min = opts.min!==undefined?opts.min:Math.min(0,...allVals);
  const max = opts.max!==undefined?opts.max:Math.max(...allVals)*1.15;
  const n = xLabels.length;
  const x = i => padL + (W-padL-padR) * (i/((n-1)||1));
  const y = v => H-padB - (H-padT-padB) * ((v-min)/((max-min)||1));
  let bandRect = "";
  if(opts.band){
    const y1=y(opts.band[1]), y2=y(opts.band[0]);
    bandRect = `<rect x="${padL}" y="${y1.toFixed(1)}" width="${(W-padL-padR)}" height="${(y2-y1).toFixed(1)}" fill="#8C6FC9" opacity="0.10"/>`;
  }
  let refLine = "";
  if(opts.ref!==undefined){
    refLine = `<line x1="${padL}" x2="${W-padR}" y1="${y(opts.ref).toFixed(1)}" y2="${y(opts.ref).toFixed(1)}" stroke="#B5502E" stroke-width="1.5" stroke-dasharray="4,3"/>`;
  }
  const lines = series.map(s=>{
    const pts = s.values.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    const dots = s.values.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.5" fill="${s.color}"/>`).join("");
    return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2"/>${dots}`;
  }).join("");
  const step = Math.ceil(n/7)||1;
  const xAxisLabels = xLabels.map((l,i)=> i%step===0 ? `<text x="${x(i).toFixed(1)}" y="${H-6}" font-size="9" fill="#5B6672" text-anchor="middle">${l}</text>` : "").join("");
  const yTicks = [min, (min+max)/2, max].map(v=>`<text x="${padL-6}" y="${(y(v)+3).toFixed(1)}" font-size="9" fill="#5B6672" text-anchor="end">${v.toFixed(1)}</text><line x1="${padL}" x2="${W-padR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="#EAEDEE" stroke-width="1"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;font-family:var(--mono)">${bandRect}${yTicks}${refLine}${lines}${xAxisLabels}</svg>`;
}
function reqFTEFromCensus(dayC,nightC,ratio){
  return (Math.max(1,Math.ceil(dayC/ratio))*12*7 + Math.max(1,Math.ceil(nightC/ratio))*12*7)/36;
}
function laborCostForRange(dateSet){
  let total = 0;
  state.nurses.forEach(n=>{
    const base = n.role==="Manager" ? state.budget.mgrWage : state.budget.rnWage;
    const shifts = state.assignments.filter(a=>a.nurseId===n.id && dateSet.has(a.date))
      .sort((a,b)=> a.date.localeCompare(b.date) || a.start-b.start);
    let hoursSoFar = 0;
    shifts.forEach(a=>{
      const nightOrWeekend = (a.start>=19 || a.start<7) || isWeekend(a.date);
      const holiday = isHoliday(a.date);
      // stacks: both differentials add on top of base pay when both apply
      let diffPct = 0;
      if(nightOrWeekend) diffPct += state.budget.diffPct;
      if(holiday) diffPct += state.budget.holidayDiffPct;
      const rate = base * (1 + diffPct/100);
      const regularLeft = Math.max(0, state.otThreshold - hoursSoFar);
      const regHrs = Math.min(a.duration, regularLeft);
      const otHrs = a.duration - regHrs;
      total += regHrs*rate + otHrs*rate*1.5;
      hoursSoFar += a.duration;
    });
  });
  return total;
}
function laborCostThisWeek(){ return laborCostForRange(new Set(DAYS)); }
function actualFTEForRange(dates){
  let totalHours=0;
  dates.forEach(d=>{
    state.assignments.filter(a=>a.date===d).forEach(a=>{
      const n = nurse(a.nurseId);
      if(n && n.role!=="Aide") totalHours += a.duration;
    });
  });
  return totalHours / (36/7 * dates.length); // normalizes any range length to a weekly-equivalent FTE
}
function avgManualFTE(dates){
  const vals = dates.map(d=>state.manualFTE[d]).filter(v=>v!=null && !isNaN(v));
  return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}
function censusByWeek(){
  const weekMap = {};
  Object.keys(state.census).forEach(dateISO=>{
    const c = state.census[dateISO];
    if(!c || (c.day===0 && c.night===0)) return;
    const dow = (new Date(dateISO+"T00:00:00").getDay()+6)%7;
    const wkStart = addDays(dateISO, -dow);
    if(!weekMap[wkStart]) weekMap[wkStart] = {dayTotal:0,nightTotal:0,n:0};
    weekMap[wkStart].dayTotal += c.day; weekMap[wkStart].nightTotal += c.night; weekMap[wkStart].n++;
  });
  return Object.keys(weekMap).sort().map(wk=>{
    const w = weekMap[wk];
    const wkDates = weekDays(wk);
    const manual = avgManualFTE(wkDates);
    return { label: wk.slice(5), avgDay: w.dayTotal/w.n, avgNight: w.nightTotal/w.n, actualFTE: manual!=null?manual:actualFTEForRange(wkDates), fromImport: manual!=null, dates: wkDates };
  });
}
function censusByMonth(){
  const monthMap = {};
  Object.keys(state.census).forEach(dateISO=>{
    const c = state.census[dateISO];
    if(!c || (c.day===0 && c.night===0)) return;
    const ym = dateISO.slice(0,7);
    if(!monthMap[ym]) monthMap[ym] = {dayTotal:0,nightTotal:0,n:0};
    monthMap[ym].dayTotal += c.day; monthMap[ym].nightTotal += c.night; monthMap[ym].n++;
  });
  return Object.keys(monthMap).sort().map(ym=>{
    const m = monthMap[ym];
    const [y,mo] = ym.split("-").map(Number);
    const daysInMonth = new Date(y,mo,0).getDate();
    const monthDates = Array.from({length:daysInMonth},(_,i)=>`${ym}-${String(i+1).padStart(2,'0')}`);
    const label = new Date(ym+"-01T00:00:00").toLocaleString('en-US',{month:'short',year:'2-digit'});
    const manual = avgManualFTE(monthDates);
    return { label, avgDay: m.dayTotal/m.n, avgNight: m.nightTotal/m.n, actualFTE: manual!=null?manual:actualFTEForRange(monthDates), fromImport: manual!=null, dates: monthDates };
  });
}

function requestsTab(){

    <tr>

      <td>${esc(reqLabel(r))}</td>
      <td>${r.note ? esc(r.note) : `<span style="color:var(--ink-soft)">—</span>`}</td>
      <td><span class="pill ${r.status}">${r.status}</span></td>
      <td>${r.status==="pending" ? `
          <button class="icon-btn" style="color:var(--green)" onclick="setReqStatus('${r.id}','approved')">✓ approve</button>
          <button class="icon-btn" style="color:var(--rust)" onclick="setReqStatus('${r.id}','denied')">✕ deny</button>` : "—"}</td>
    </tr>`).join("") || `<tr><td colspan="6" class="empty">No requests yet.</td></tr>`;

  const cOrder = {pending:0, approved:1, rejected:2};
  const subs = [...state.censusSubmissions].sort((a,b)=> (cOrder[a.status]-cOrder[b.status]) || b.date.localeCompare(a.date));
  const cenRows = subs.map(s=>{
    const n = nurse(s.nurseId);
    const shifts = state.assignments.filter(a=>a.nurseId===s.nurseId && a.date===s.date).sort((a,b)=>a.start-b.start)
      .map(a=>`${fmtHour(a.start)}–${fmtHour((a.start+a.duration)%24)}`).join(", ") || "not on schedule";
    const conflicts = state.censusSubmissions.filter(o=>o.id!==s.id && o.date===s.date && o.status!=="rejected" &&
      ((s.day!=null && o.day!=null && o.day!==s.day) || (s.night!=null && o.night!=null && o.night!==s.night)));
    const flags = [];
    if(conflicts.length) flags.push(`Differs from ${conflicts.map(o=>`${esc(nurse(o.nurseId)?.name||"someone")} (day ${o.day==null?"—":o.day} / night ${o.night==null?"—":o.night})`).join(", ")}`);
    if((s.day!=null && s.day>12) || (s.night!=null && s.night>12)) flags.push("Above the unit's 12-patient capacity, likely a typo");
    const cell = (field)=> s.status==="pending"
      ? `<input type="number" min="0" value="${s[field]==null?"":s[field]}" style="width:56px" onchange="editCensusSub('${s.id}','${field}',this.value)">`
      : (s[field]==null ? `<span style="color:var(--ink-soft)">—</span>` : s[field]);
    return `<tr>
      <td>${s.date}</td>
      <td>${esc(n?n.name:"—")}</td>
      <td>${shifts}</td>
      <td>${cell("day")}</td>
      <td>${cell("night")}</td>
      <td>${s.note ? esc(s.note) : `<span style="color:var(--ink-soft)">—</span>`}${flags.map(f=>`<div class="flag warn" style="display:block;margin-top:4px">${f}</div>`).join("")}</td>
      <td><span class="pill ${statusClass(s.status)}">${s.status}</span></td>
      <td>${s.status==="pending" ? `
          <button class="icon-btn" style="color:var(--green)" onclick="approveCensus('${s.id}')">✓ approve</button>
          <button class="icon-btn" style="color:var(--rust)" onclick="rejectCensus('${s.id}')">✕ reject</button>` : "—"}</td>
    </tr>`;
  }).join("") || `<tr><td colspan="8" class="empty">No census submissions yet. Staff send these from the Employee portal, for days they worked.</td></tr>`;

  const nurseOpts = state.nurses.map(n=>`<option value="${n.id}">${esc(n.name)}</option>`).join("");
  const dateOpts = DAYS.map(d=>`<option value="${d}">${d}</option>`).join("");
  return `
    ${flashMessage ? `<div class="flag warn block">${flashMessage}</div>` : ""}
    <div class="panel">
      <h2>Staff requests</h2>
      <p class="desc">Staff send these from the calendar in the Employee portal, and you can log one for them below. Approving PTO or Off removes any shift that nurse already has that day and stops them being scheduled, and both count toward their equity score (PTO carries more weight). A desired shift is informational: it counts toward equity but never puts anyone on the schedule, you build around it.</p>
      <div style="overflow-x:auto;">
      <table><thead><tr><th>Nurse</th><th>Date</th><th>Request</th><th>Note</th><th>Status</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table>
      </div>
      <div class="inline-form">
        <div><label>Nurse</label><select id="reqNurse">${nurseOpts}</select></div>
        <div><label>Date</label><select id="reqDate">${dateOpts}</select></div>
        <div><label>Type</label><select id="reqType"><option>PTO</option><option>Off</option><option>Desired shift</option></select></div>
        <button class="btn" onclick="addRequest()">Log request</button>
      </div>
    </div>

    <div class="panel">
      <h2>Census submitted by staff</h2>
      <p class="desc">Staff send in the patient count for days they worked. Review each one, correct the number if it looks off, then approve to record it in Census &amp; FTE and the trend charts, or reject it. Several people can submit for the same day: approving overwrites the number recorded for that day and shift band, and conflicting counts are flagged so you can pick the right one.</p>
      <div style="overflow-x:auto;">
      <table><thead><tr><th>Date</th><th>Nurse</th><th>Their shift</th><th>Day</th><th>Night</th><th>Note</th><th>Status</th><th></th></tr></thead>
      <tbody>${cenRows}</tbody></table>
      </div>
      <div class="inline-form">
        <div style="flex:1;min-width:260px"><label>Wording staff see when submitting a count (pick one measure and keep it, or counts won't be comparable)</label>
          <input type="text" style="width:100%" value="${esc(state.censusPrompt)}" onchange="setCensusPrompt(this.value)"></div>
      </div>
    </div>`;
}
function editCensusSub(id, field, val){
  const s = state.censusSubmissions.find(x=>x.id===id); if(!s) return;
  snapshot();
  s[field] = (val==="" || isNaN(Number(val))) ? null : Math.max(0, Number(val));
  render();
}
function approveCensus(id){
  const s = state.censusSubmissions.find(x=>x.id===id); if(!s || s.status!=="pending") return;
  if(s.day==null && s.night==null){ flashMessage = "That submission has no numbers to record. Enter a day or night count first, or reject it."; render(); return; }
  snapshot();
  s.status = "approved";
  const cur = state.census[s.date] || {day:0,night:0};
  const replaced = [];
  if(s.day!=null){ if(cur.day && cur.day!==s.day) replaced.push(`day ${cur.day} → ${s.day}`); cur.day = s.day; }
  if(s.night!=null){ if(cur.night && cur.night!==s.night) replaced.push(`night ${cur.night} → ${s.night}`); cur.night = s.night; }
  state.census[s.date] = cur;
  const n = nurse(s.nurseId);
  flashMessage = `Approved ${esc(n?n.name:"staff")}'s census for ${s.date}${replaced.length?`, replacing the recorded ${esc(replaced.join(" and "))}`:""}. It now feeds Census & FTE and the trend charts.`;
  render();
}
function rejectCensus(id){
  const s = state.censusSubmissions.find(x=>x.id===id); if(!s || s.status!=="pending") return;
  snapshot();
  s.status = "rejected";
  const n = nurse(s.nurseId);
  flashMessage = `Rejected ${esc(n?n.name:"staff")}'s census for ${s.date}. They can send a corrected one.`;
  render();
}
function setCensusPrompt(v){ snapshot(); state.censusPrompt = v; render(); }

function setReqStatus(id,status){
  const r = state.requests.find(r=>r.id===id);
  const n = r && nurse(r.nurseId);
  if(!r || r.status!=="pending") return;
  if(!n){ flashMessage = "That nurse is no longer on the roster."; render(); return; }
  snapshot();
  r.status = status;
  const removeShifts = ()=>{
    const before = state.assignments.length;
    state.assignments = state.assignments.filter(a=>!(a.nurseId===n.id && a.date===r.date));
    return before - state.assignments.length;
  };
  const safeName = esc(n.name);
  if(r.type==="PTO"){
    if(status==="denied"){ n.ptoDenied += 1; flashMessage = `${safeName}'s PTO denied for ${r.date} — this adds to their equity score.`; }
    else{
      n.ptoHonored += 1;
      const removed = removeShifts();
      flashMessage = `${safeName}'s PTO approved for ${r.date}${removed?`, ${removed} conflicting shift(s) removed from Coverage`:''}. Equity score updated.`;
    }
  } else if(r.type==="Off"){
    if(status==="denied"){ n.prefDenied += 1; flashMessage = `${safeName}'s Off request denied for ${r.date} — added to their equity score.`; }
    else{
      n.prefHonored += 1;
      const removed = removeShifts();
      flashMessage = `${safeName}'s Off request approved for ${r.date}${removed?`, ${removed} conflicting shift(s) removed from Coverage`:''}. They won't be scheduled that day, and it counts toward their equity score at a lower weight than PTO.`;
    }
  } else {
    // Desired shift: informational. Counts toward equity, but never moves a shift on its own.
    if(status==="denied"){ n.prefDenied += 1; flashMessage = `${safeName}'s desired shift for ${r.date} denied — added to their equity score.`; }
    else{ n.prefHonored += 1; flashMessage = `${safeName}'s desired shift (${esc(reqLabel(r))}) for ${r.date} approved — counted in their equity score. This doesn't put them on the schedule, build it in yourself.`; }
  }
  render();
}
function addRequest(){
  const nurseId = document.getElementById("reqNurse").value;
  const date = document.getElementById("reqDate").value;
  const type = document.getElementById("reqType").value;
  snapshot();

/* ---- Equity tab ---- */
function syncEquityFromWeek(){
  const wk = state.weekStart;
  if(state.syncedWeeks.includes(wk)){
    flashMessage = `${weekLabel()} was already synced into YTD totals. Use Undo (top of page) if you need to redo it.`;
    render(); return;
  }
  snapshot();
  const tally = {};
  DAYS.forEach(d=>{
    const isWknd = isWeekend(d), isHol = isHoliday(d);
    state.assignments.filter(a=>a.date===d).forEach(a=>{
      const n = nurse(a.nurseId);
      if(!n || n.role==="Aide") return;
      if(!tally[n.id]) tally[n.id] = {nights:0,weekends:0,holidays:0};
      const isNight = a.start>=19 || a.start<7;
      if(isNight) tally[n.id].nights++;
      if(isWknd) tally[n.id].weekends++;
      if(isHol) tally[n.id].holidays++;
    });
  });
  Object.keys(tally).forEach(id=>{
    const n = nurse(id);
    n.nightsYTD += tally[id].nights;
    n.weekendsYTD += tally[id].weekends;
    n.holidaysYTD += tally[id].holidays;
  });
  state.syncedWeeks.push(wk);
  const count = Object.keys(tally).length;
  flashMessage = count
    ? `Synced ${count} nurse${count===1?'':'s'}' actual nights/weekends/holidays from ${weekLabel()} into their YTD totals. This week won't be double-counted if you sync again.`
    : `No RN/Manager shifts found in ${weekLabel()} to sync.`;
  render();
}
function equityField(n, field, width){
  return `<input type="number" min="0" value="${n[field]}" style="width:${width||50}px" onchange="updateNurse('${n.id}','${field}',Number(this.value))">`;
}
function equityTab(){
  const sorted = state.nurses.filter(n=>n.role!=="Aide").sort((a,b)=>equityScore(b)-equityScore(a));
  const rows = sorted.map(n=>`
    <tr>

      <td>${equityField(n,'holidaysYTD')}</td>
      <td>${equityField(n,'ptoDenied')}</td>
      <td>${equityField(n,'ptoHonored')}</td>
      <td>${equityField(n,'prefDenied')}</td>
      <td>${equityField(n,'prefHonored')}</td>
      <td>${equityField(n,'calloffs')}</td>
      <td><strong>${equityScore(n).toFixed(1)}</strong></td>
    </tr>`).join("");
  return `
    <div class="panel">
      <h2>Equity score, rolling YTD</h2>
      ${flashMessage ? `<div class="flag warn block">${flashMessage}</div>` : ""}
      <p class="desc">Every number below is directly editable, use that now to enter real backdated totals since this tool has no history of its own yet. Going forward, use "Sync this week into YTD" below instead of hand-editing, it adds actual worked nights/weekends/holidays from whichever week you're viewing in Coverage, once, so you don't have to keep re-typing running totals yourself. PTO and preference columns already update automatically when you approve or deny a request in the Requests tab, editing them here just corrects them if needed.</p>
      <div class="row" style="margin-bottom:14px">
        <button class="btn secondary" onclick="syncEquityFromWeek()">Sync this week (${weekLabel()}) into YTD</button>
      </div>
      <div style="overflow-x:auto;">
      <table><thead><tr><th>Nurse</th><th>Nights YTD</th><th>Weekends YTD</th><th>Holidays YTD</th><th>PTO denied</th><th>PTO approved</th><th>Pref. denied</th><th>Pref. honored</th><th>Call-offs</th><th>Score</th></tr></thead>
      <tbody>${rows}</tbody></table>
      </div>
      <p class="foot-note">Aides aren't included here on purpose: they self-schedule, so a fairness model built around who the unit assigns undesirable shifts to doesn't fit a role that picks its own hours. Call-offs are shown but not counted in the score, on purpose, same for overtime hours worked, both explained above the formula in the code. Formula: nights×1.0 + weekends×1.4 + holidays×2.0 + PTOdenied×1.5 − PTOapproved×1.0 + prefDenied×1.0 − prefHonored×0.5. These weights are all placeholders, set them with staff input before you trust this for real decisions.</p>
    </div>`;
}

function populateCalloffShifts(){
  const sel = document.getElementById("coShift");
  if(!sel) return;
  const nurseId = document.getElementById("coNurse").value;
  const shifts = state.assignments.filter(a=>a.nurseId===nurseId).sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start);
  sel.innerHTML = shifts.map(a=>`<option value="${a.id}">${a.date} ${fmtHour(a.start)}–${fmtHour((a.start+a.duration)%24)}</option>`).join("") || `<option value="">No shifts scheduled</option>`;
}
function runCallout(){
  const id = document.getElementById("coShift").value;
  const a = state.assignments.find(x=>x.id===id);
  const results = document.getElementById("calloutResults");
  if(!a){ results.innerHTML = `<p class="empty">This nurse has no scheduled shifts to call off.</p>`; return; }
  const calledOff = nurse(a.nurseId);
  const eligible = state.nurses.filter(n=>{
    if(n.id===a.nurseId) return false;
    if(approvedPTO(n.id,a.date)) return false;
    return !restViolation(n.id,a.date,a.start,a.duration);
  }).sort((x,y)=> equityScore(x)-equityScore(y));

  const list = eligible.slice(0,5).map(n=>`
    <li><strong>${esc(n.name)}</strong> — equity score ${equityScore(n).toFixed(1)}, ${weeklyHoursFor(n.id)}hrs already this week
      ${n.cert?'<span class="pill cert">cert</span>':'<span class="pill nocert">no cert</span>'}
      <button class="btn secondary" style="margin-left:8px;padding:3px 8px;font-size:11px" onclick="assignReplacement('${a.id}','${n.id}')">Assign</button>
    </li>`).join("");

  results.innerHTML = `
    ${calledOff.cert ? `<div class="flag warn block">${esc(calledOff.name)} is crisis-certified, try to replace with another certified nurse if the block would otherwise have none.</div>` : ""}
    <p style="margin:0 0 6px;font-size:12.5px;color:var(--ink-soft)">Ranked lowest equity score first, meaning least burden carried so far, among those rest-compliant and not on approved PTO:</p>
    <ol class="rank-list">${list || "<li>No eligible replacement found without a rest or PTO conflict.</li>"}</ol>`;
}
function assignReplacement(assignmentId, nurseId){
  snapshot();
  const a = state.assignments.find(x=>x.id===assignmentId);
  a.nurseId = nurseId;
  activeTab="Coverage"; render();
}
