/* ---- Employee portal ---- */
function setEmployeeView(v){ state.employeeView=v; flashMessage=""; render(); }
function empMonthKey(){ return state.employeeMonth || state.weekStart.slice(0,7); }
function shiftEmployeeMonth(n){
  const [y,m] = empMonthKey().split("-").map(Number);
  const d = new Date(y, m-1+n, 1);
  state.employeeMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  state.empSel = {start:null,end:null,picking:false};
  flashMessage = "";
  render();
}
function jumpEmployeeToday(){
  state.employeeMonth = todayISO().slice(0,7);
  state.empSel = {start:null,end:null,picking:false};
  flashMessage = "";
  render();
}
// Past days (and today) select one day at a time, for census. Future days can be a range, for requests.
function empDayClick(dateISO){
  const today = todayISO(), s = state.empSel;
  flashMessage = "";
  if(dateISO <= today) state.empSel = {start:dateISO,end:dateISO,picking:false};
  else if(s.picking && s.start && s.start > today) state.empSel = {start:s.start,end:dateISO,picking:false};
  else state.empSel = {start:dateISO,end:dateISO,picking:true};
  render();
}
function empSelDates(){
  const s = state.empSel; if(!s.start) return [];
  const a = s.start<=s.end ? s.start : s.end, b = s.start<=s.end ? s.end : s.start;
  const out=[]; let d=a, guard=0;
  while(d<=b && guard<62){ out.push(d); d=addDays(d,1); guard++; }
  return out;
}
function clearEmpSel(){ state.empSel={start:null,end:null,picking:false}; render(); }
function setEmpReqType(v){ state.empReqType=v; render(); }

// Which shift bands (day 7a-7p, night 7p-7a) a nurse's shifts on a date touched, so the census form only asks for those.
function bandsWorked(nurseId, dateISO){
  let day=false, night=false;
  state.assignments.filter(a=>a.nurseId===nurseId && a.date===dateISO).forEach(a=>{
    const s=a.start, e=a.start+a.duration;
    if(s<19 && e>7) day=true;
    if(e>19) night=true;
  });
  if(!day && !night){ day=true; night=true; }
  return {day,night};
}

function dayDotsHTML(d, shifts, reqs, cen, today){
  const dots = [];
  if(shifts.length) dots.push('<span class="dot dot-shift" title="Scheduled"></span>');
  if(reqs && reqs.length){
    const pri = r => r.status==="pending"?0:r.status==="approved"?1:2;
    const worst = [...reqs].sort((a,b)=>pri(a)-pri(b))[0];
    dots.push(`<span class="dot dot-${statusClass(worst.status)}" title="${esc(reqLabel(worst))}: ${worst.status}"></span>`);
  }
  if(shifts.length && d<=today){
    dots.push(cen ? `<span class="dot dot-${statusClass(cen.status)}" title="Census ${cen.status}"></span>`
                  : `<span class="dot dot-due" title="Census not sent"></span>`);
  }
  return dots.length ? `<div class="cal-dots">${dots.join("")}</div>` : "";
}
// One-line recap of a single day: shift, any request, census status. This is what makes tapping a
// day meaningful on a phone, where the grid itself only shows dots, not full detail.
function dayStatusSummaryHTML(empId, date){
  const shifts = state.assignments.filter(a=>a.nurseId===empId && a.date===date).sort((a,b)=>a.start-b.start);
  const reqs = state.requests.filter(r=>r.nurseId===empId && r.date===date);
  const cen = state.censusSubmissions.filter(c=>c.nurseId===empId && c.date===date).slice(-1)[0];
  const parts = [shifts.length ? `Shift: ${shifts.map(a=>`${fmtHour(a.start)}–${fmtHour((a.start+a.duration)%24)}`).join(", ")}` : "No shift scheduled"];
  if(reqs.length) parts.push(reqs.map(r=>`${esc(reqLabel(r))} (${r.status})`).join(", "));
  if(shifts.length && date<=todayISO()) parts.push(cen ? `Census sent (${cen.status})` : "Census not sent yet");
  return `<p class="desc" style="margin:0 0 8px;font-weight:600;color:var(--ink)">${parts.join(" · ")}</p>`;
}
function employeeCalendarHTML(empId){
  const [year, mon] = empMonthKey().split("-").map(Number);
  const first = new Date(year, mon-1, 1);
  const daysInMonth = new Date(year, mon, 0).getDate();
  const monthLabel = first.toLocaleString('en-US',{month:'long',year:'numeric'});
  const today = todayISO();
  const selSet = new Set(empSelDates());
  const shiftsByDate = {}, reqsByDate = {}, cenByDate = {};
  state.assignments.filter(a=>a.nurseId===empId).forEach(a=>{ (shiftsByDate[a.date]=shiftsByDate[a.date]||[]).push(a); });
  state.requests.filter(r=>r.nurseId===empId).forEach(r=>{ (reqsByDate[r.date]=reqsByDate[r.date]||[]).push(r); });
  state.censusSubmissions.filter(c=>c.nurseId===empId).forEach(c=>{ cenByDate[c.date]=c; }); // latest submission per day
  const cells = [];
  for(let i=0;i<(first.getDay()+6)%7;i++) cells.push(`<div class="cal-cell empty-cell"></div>`);
  for(let dt=1; dt<=daysInMonth; dt++){
    const d = `${year}-${String(mon).padStart(2,'0')}-${String(dt).padStart(2,'0')}`;
    const shifts = (shiftsByDate[d]||[]).sort((a,b)=>a.start-b.start);
    const cls = ["cal-cell","selectable"];
    if(d<today) cls.push("past");
    if(d===today) cls.push("today");
    if(selSet.has(d)) cls.push("sel");
    const style = (isHoliday(d) && !selSet.has(d)) ? ' style="background:var(--gold-soft)"' : '';
    const chips = shifts.map(a=>`<div class="cal-shift ${d<today?'done':''}">${fmtHour(a.start)}–${fmtHour((a.start+a.duration)%24)}</div>`).join("");
    let tags = (reqsByDate[d]||[]).map(r=>`<span class="cal-tag ${statusClass(r.status)}" title="${esc(reqLabel(r))}: ${r.status}">${r.type==="PTO"?"PTO":r.type==="Off"?"OFF":"WANT"}</span>`).join("");
    if(shifts.length && d<=today){
      const c = cenByDate[d];
      tags += c ? `<span class="cal-tag ${statusClass(c.status)}" title="Census ${c.status}">CEN</span>`
                : `<span class="cal-tag due" title="You worked this day, census not sent yet">CEN?</span>`;
    }
    const dots = dayDotsHTML(d, shifts, reqsByDate[d], cenByDate[d], today);
    cells.push(`<div class="${cls.join(" ")}"${style} onclick="empDayClick('${d}')"><div class="cal-daynum">${dt}</div><div class="cal-detail">${chips}${tags}</div>${dots}</div>`);
  }
  return `
    <div class="row" style="margin-bottom:8px">
      <button class="btn secondary" onclick="shiftEmployeeMonth(-1)">← Prev</button>
      <strong style="min-width:130px;text-align:center">${monthLabel}</strong>
      <button class="btn secondary" onclick="shiftEmployeeMonth(1)">Next →</button>
      <button class="btn secondary" onclick="jumpEmployeeToday()">Today</button>
    </div>
    <div class="cal-grid">${DAY_NAMES.map(d=>`<div class="cal-head">${d}</div>`).join("")}${cells.join("")}</div>
    <div class="legend">
      <span><span class="cal-shift" style="display:inline-block">7a–7p</span> scheduled</span>
      <span><span class="cal-shift done" style="display:inline-block">7a–7p</span> past shift</span>
      <span><span class="cal-tag pending">PTO</span><span class="cal-tag approved">OFF</span><span class="cal-tag denied">WANT</span> your requests: amber waiting, green approved, rust denied</span>
      <span><span class="cal-tag due">CEN?</span> you worked, census not sent</span>
      <span style="color:var(--ink-soft)">On a narrow screen, days show colored dots instead, tap any day for the full detail</span>
    </div>`;
}

function employeeActionPanel(emp){

    if(mine.length){
      const c = mine[mine.length-1];
      return summary + wrap(`<strong>Census for ${first}</strong>
        <p class="desc" style="margin:4px 0 0">Your shift: ${shiftText}. You sent day ${c.day==null?"—":c.day} / night ${c.night==null?"—":c.night}, now <span class="pill ${statusClass(c.status)}">${c.status}</span>.${c.status==="pending" ? " To change it, withdraw it and send a new one." : ""}</p>
        <div class="row">${c.status==="pending"?`<button class="btn secondary" onclick="withdrawCensus('${c.id}')">Withdraw</button>`:""}<button class="btn secondary" onclick="clearEmpSel()">Close</button></div>`);
    }
    const bands = bandsWorked(emp.id, first);
    return summary + wrap(`
      <strong>Census for ${first}</strong>
      <p class="desc" style="margin:4px 0 0">Your shift: ${shiftText}. ${esc(state.censusPrompt)}</p>
      <div class="row">
        ${bands.day?`<div><label>Day census (7a–7p)</label><input type="number" min="0" id="cenDay" style="width:90px"></div>`:""}
        ${bands.night?`<div><label>Night census (7p–7a)</label><input type="number" min="0" id="cenNight" style="width:90px"></div>`:""}
        <div style="flex:1;min-width:180px"><label>Note (optional)</label><input type="text" id="cenNote" style="width:100%"></div>
      </div>
      <div class="row"><button class="btn" onclick="submitCensus()">Send to manager for review</button><button class="btn secondary" onclick="clearEmpSel()">Close</button></div>`);
  }
  const type = state.empReqType;
  const rangeLabel = first===last ? first : `${first} to ${last} (${dates.length} days)`;
  const scheduledDays = dates.filter(d=>state.assignments.some(a=>a.nurseId===emp.id && a.date===d)).length;
  const summary = first===last ? dayStatusSummaryHTML(emp.id, first) : "";
  const help = {
    "PTO":"Paid time off. If approved, any shift you have on those days comes off the schedule.",
    "Off":"You can't work those days. If approved, you won't be scheduled and any shift you have then comes off.",
    "Desired shift":"Hours you'd like to work. Your manager sees it when building the schedule, approval doesn't put you on it automatically."
  }[type];
  return summary + wrap(`
    <strong>${rangeLabel}</strong>

      ${type==="Desired shift" ? `<div><label>Start</label><select id="empStart">${Array.from({length:24},(_,h)=>`<option value="${h}" ${h===emp.pref?"selected":""}>${fmtHour(h)}</option>`).join("")}</select></div><div><label>Hours</label><input type="number" id="empDur" value="12" min="1" max="16" style="width:60px"></div>` : ""}
      <div style="flex:1;min-width:180px"><label>Note (optional)</label><input type="text" id="empNote" style="width:100%"></div>
    </div>
    <p class="desc" style="margin:0">${help}${scheduledDays && type!=="Desired shift" ? ` You're currently scheduled on ${scheduledDays} of these day${scheduledDays===1?"":"s"}.` : ""}</p>
    <div class="row"><button class="btn" onclick="submitCalendarRequest()">Submit request${dates.length>1?"s":""}</button><button class="btn secondary" onclick="clearEmpSel()">Clear selection</button></div>`);
}

function submitCalendarRequest(){
  const today = todayISO();
  const future = empSelDates().filter(d=>d>today);
  if(!future.length) return;
  const type = state.empReqType;
  const note = (document.getElementById("empNote")?.value || "").trim();
  let start=null, duration=null;
  if(type==="Desired shift"){
    start = Number(document.getElementById("empStart").value);
    duration = Math.min(16, Math.max(1, Number(document.getElementById("empDur").value)||12));
  }
  const fresh = future.filter(d=>!state.requests.some(r=>r.nurseId===state.employeeId && r.date===d && r.type===type && r.status!=="denied"));
  const skipped = future.length - fresh.length;
  if(!fresh.length){
    flashMessage = `You already have a ${type} request for ${future.length===1?"that day":"those days"}. Withdraw it first if you want to change it.`;
    render(); return;
  }
  snapshot();
  fresh.forEach(d=>{
    const req = {id:"r"+Math.random().toString(36).slice(2), nurseId:state.employeeId, date:d, type, status:"pending"};
    if(note) req.note = note;
    if(type==="Desired shift"){ req.start=start; req.duration=duration; }
    state.requests.push(req);
  });
  state.empSel = {start:null,end:null,picking:false};
  flashMessage = `Sent ${fresh.length} ${type} request${fresh.length===1?"":"s"} to your manager${skipped?` (${skipped} skipped, already requested)`:""}. Its status shows on your calendar.`;
  render();
}

function submitCensus(){
  const date = state.empSel.start, empId = state.employeeId;
  if(!date || date>todayISO()) return;
  if(!state.assignments.some(a=>a.nurseId===empId && a.date===date)){ flashMessage = "You weren't scheduled that day."; render(); return; }
  const read = id => { const el=document.getElementById(id); if(!el || el.value==="") return null; const v=Number(el.value); return (isNaN(v) || v<0) ? NaN : v; };
  const day = read("cenDay"), night = read("cenNight");
  if(Number.isNaN(day) || Number.isNaN(night)){ flashMessage = "Census has to be a number, 0 or more."; render(); return; }
  if(day==null && night==null){ flashMessage = "Enter at least one count before sending."; render(); return; }
  const note = (document.getElementById("cenNote")?.value || "").trim();
  snapshot();
  state.censusSubmissions.push({id:"c"+Math.random().toString(36).slice(2), nurseId:empId, date, day, night, note, status:"pending"});
  flashMessage = `Census for ${date} sent to your manager for review.`;
  render();
}
function withdrawRequest(id){
  const r = state.requests.find(x=>x.id===id);
  if(!r || r.status!=="pending" || r.nurseId!==state.employeeId) return;
  snapshot();
  state.requests = state.requests.filter(x=>x.id!==id);
  flashMessage = `Withdrew your ${r.type} request for ${r.date}.`;
  render();
}
function withdrawCensus(id){
  const c = state.censusSubmissions.find(x=>x.id===id);
  if(!c || c.status!=="pending" || c.nurseId!==state.employeeId) return;
  snapshot();
  state.censusSubmissions = state.censusSubmissions.filter(x=>x.id!==id);
  flashMessage = `Withdrew your census for ${c.date}.`;
  render();
}

function employeePortal(){
  if(!state.nurses.length){
    return `<div class="panel"><h2>Employee portal</h2><p class="desc">No staff on the roster yet. Add nurses and aides in the Roster tab first, each one then shows up here so they can preview their own view.</p></div>`;
  }
  if(!state.employeeId || !nurse(state.employeeId)) state.employeeId = state.nurses[0].id;
  const emp = nurse(state.employeeId) || state.nurses[0];
  const nurseOpts = state.nurses.map(n=>`<option value="${n.id}" ${n.id===emp.id?'selected':''}>${esc(n.name)}</option>`).join("");

  const weekShifts = state.assignments.filter(a=>a.nurseId===emp.id && DAYS.includes(a.date)).sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start);
  const shiftRows = weekShifts.map(a=>`<tr><td>${a.date}</td><td>${fmtHour(a.start)}–${fmtHour((a.start+a.duration)%24)}</td></tr>`).join("")
    || `<tr><td colspan="2" class="empty">No shifts scheduled this week.</td></tr>`;

  const bd = scoreBreakdown(emp);
  const total = bd.reduce((s,x)=>s+x.points,0);
  const scored = state.nurses.filter(n=>n.role!=="Aide");
  const unitAvg = scored.reduce((s,n)=>s+equityScore(n),0)/scored.length;
  const bdRows = bd.map(x=>`<tr><td>${x.label}</td><td style="font-family:var(--mono)">${x.detail}</td><td style="font-family:var(--mono)">${x.points>=0?'+':''}${x.points.toFixed(1)}</td></tr>`).join("");
  const scorePanel = emp.role==="Aide" ? `
    <div class="panel">
      <h2>Score</h2>
      <p class="desc">Aides aren't scored under this system. It's built around who the unit assigns undesirable shifts to, and an aide picks their own hours, so that fairness question doesn't apply the same way here.</p>
    </div>` : `
    <div class="panel">
      <h2>My score: ${total.toFixed(1)}</h2>
      <p class="desc">Unit average right now is ${unitAvg.toFixed(1)}. ${total>unitAvg
        ? "You're above average, meaning you've carried more of the unit's undesirable shifts or had more requests denied than most. That gives you standing for your next time-off request or to be skipped for the next unwanted pickup."
        : "You're at or below the unit average right now."} Here's exactly how it's built, nothing hidden:</p>
      <div style="overflow-x:auto;"><table><thead><tr><th>Factor</th><th>Calculation</th><th>Points</th></tr></thead><tbody>${bdRows}</tbody></table></div>
      <p class="foot-note">Call-offs aren't part of this score. This measures how the unit has treated you, not your attendance record, the two are tracked separately on purpose.</p>
    </div>`;

  const myRequests = state.requests.filter(r=>r.nurseId===emp.id).sort((a,b)=>b.date.localeCompare(a.date));
  const reqRows = myRequests.map(r=>`<tr><td>${r.date}</td><td>${esc(reqLabel(r))}</td><td>${r.note?esc(r.note):""}</td><td><span class="pill ${r.status}">${r.status}</span></td><td>${r.status==="pending"?`<button class="icon-btn" onclick="withdrawRequest('${r.id}')">withdraw</button>`:""}</td></tr>`).join("")
    || `<tr><td colspan="5" class="empty">No requests yet. Tap a future day on the calendar to make one.</td></tr>`;
  const myCensus = state.censusSubmissions.filter(c=>c.nurseId===emp.id).sort((a,b)=>b.date.localeCompare(a.date));
  const cenRows = myCensus.map(c=>`<tr><td>${c.date}</td><td>${c.day==null?"—":c.day}</td><td>${c.night==null?"—":c.night}</td><td>${c.note?esc(c.note):""}</td><td><span class="pill ${statusClass(c.status)}">${c.status}</span></td><td>${c.status==="pending"?`<button class="icon-btn" onclick="withdrawCensus('${c.id}')">withdraw</button>`:""}</td></tr>`).join("")
    || `<tr><td colspan="6" class="empty">Nothing sent yet. Tap a day you worked on the calendar to send its census.</td></tr>`;

  return `
    ${flashMessage ? `<div class="flag warn block">${flashMessage}</div>` : ""}
    <div class="panel">
      <h2>Viewing as</h2>
      <select onchange="state.employeeId=this.value; state.empSel={start:null,end:null,picking:false}; flashMessage=''; render()">${nurseOpts}</select>
      <p class="desc" style="margin-top:8px">In a real system this would just be the logged-in nurse's own account. This selector exists only so you can preview any nurse's view in this demo. A real portal would not let one nurse see another nurse's individual score, only their own next to the unit average, which is what's shown below.</p>
    </div>
    <div class="panel">
      <h2>My schedule</h2>
      <div class="row" style="margin-bottom:10px">
        <button class="btn ${state.employeeView==='week'?'':'secondary'}" onclick="setEmployeeView('week')">Week</button>
        <button class="btn ${state.employeeView==='month'?'':'secondary'}" onclick="setEmployeeView('month')">Month</button>
      </div>
      ${state.employeeView==='week'
        ? `${weekNavControlHTML()}<div style="overflow-x:auto;"><table><thead><tr><th>Date</th><th>Shift</th></tr></thead><tbody>${shiftRows}</tbody></table></div>
           <p class="foot-note">Requests and census are sent from the Month view, tap days on the calendar.</p>`
        : employeeCalendarHTML(emp.id) + employeeActionPanel(emp)}
    </div>
    <div class="panel">
      <h2>My requests</h2>
      <div style="overflow-x:auto;"><table><thead><tr><th>Date</th><th>Request</th><th>Note</th><th>Status</th><th></th></tr></thead><tbody>${reqRows}</tbody></table></div>
    </div>
    <div class="panel">
      <h2>My census submissions</h2>
      <div style="overflow-x:auto;"><table><thead><tr><th>Date</th><th>Day</th><th>Night</th><th>Note</th><th>Status</th><th></th></tr></thead><tbody>${cenRows}</tbody></table></div>
    </div>
    ${scorePanel}`;
}

render();
initPersistence();
document.addEventListener("keydown", e=>{
  if(e.key!=="Escape") return;
  if(selDate!==null){
    selDate=null; selStart=null; selEnd=null; pickingRange=false;
    const he = document.getElementById("hourEditor"); if(he) he.innerHTML="";
    render();
    return;
  }
  const asf = document.getElementById("addShiftForm");
  if(asf && asf.innerHTML.trim()) asf.innerHTML="";
});
</script>
</body>
</html>
